<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red privada permisionada — ECEME</title>
<style>
  :root {
    --verde: #16a34a; --verde-bg: #052e16;
    --rojo: #dc2626;  --rojo-bg: #450a0a;
    --ambar: #d97706; --ambar-bg: #451a03;
    --azul: #2563eb;
    --panel: #0f172a; --panel2: #1e293b; --borde: #334155;
    --txt: #e2e8f0; --txt2: #94a3b8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: radial-gradient(circle at 50% -10%, #17386a 0, #020617 42rem); color: var(--txt); padding: 24px; }
  .contenedor { max-width: 1180px; margin: 0 auto; }
  .marca { color: #93c5fd; font-size: 10px; font-weight: 900; letter-spacing: .22em; text-transform: uppercase; margin-bottom: 9px; }
  .hero { display: grid; grid-template-columns: 1.35fr .9fr; gap: 22px; padding: 25px; margin-bottom: 18px; border: 1px solid #315784; border-radius: 18px; background: linear-gradient(120deg, rgba(15,35,64,.96), rgba(15,23,42,.9)); box-shadow: 0 24px 65px rgba(0,0,0,.28); }
  .hero h1 { font-size: clamp(24px, 4vw, 37px); letter-spacing: -.03em; line-height: 1.08; margin: 0 0 10px; text-transform: none; }
  .hero h1 strong { color: #60a5fa; }
  .hero-text { max-width: 690px; color: #cbd5e1; font-size: 14px; line-height: 1.6; margin: 0; }
  .prueba { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
  .prueba div { padding: 10px 8px; border-left: 3px solid var(--verde); background: rgba(2,6,23,.38); }
  .prueba b { display:block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #f8fafc; }
  .prueba span { color: var(--txt2); font-size: 10px; line-height: 1.35; display: block; margin-top: 3px; }
  .sello { align-self: stretch; display: flex; flex-direction: column; justify-content: center; padding: 20px; text-align: center; border: 1px dashed #4ade80; border-radius: 14px; background: rgba(5,46,22,.42); }
  .sello .ico { font-size: 46px; line-height: 1; margin-bottom: 10px; }
  .sello b { color: #86efac; font-size: 14px; letter-spacing: .08em; }
  .sello small { color: #bbf7d0; margin-top: 7px; line-height: 1.45; }
  .visual-hero { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 22px; margin-bottom:18px; border:1px solid #315784; border-radius:18px; background:linear-gradient(120deg,rgba(15,35,64,.96),rgba(15,23,42,.9)); }
  .visual-title { font-size:13px; font-weight:900; letter-spacing:.18em; color:#e2e8f0; text-transform:uppercase; }
  .cadena-visual { display:flex; align-items:center; gap:0; color:#60a5fa; }
  .cadena-visual .punto { width:52px; height:52px; display:grid; place-items:center; border:2px solid #3b82f6; border-radius:50%; background:#0b1b33; font-size:23px; box-shadow:0 0 18px rgba(59,130,246,.35); }
  .cadena-visual .linea { width:clamp(45px,9vw,130px); height:2px; background:linear-gradient(90deg,#3b82f6,#4ade80); position:relative; overflow:hidden; }
  .cadena-visual .linea::after { content:''; position:absolute; width:16px; height:100%; background:#e2e8f0; animation:viaje 2s linear infinite; }
  @keyframes viaje { from { transform:translateX(-20px); } to { transform:translateX(150px); } }
  h1 { font-size: 20px; letter-spacing: 1px; margin: 0 0 4px; text-transform: uppercase; }
  .sub { color: var(--txt2); font-size: 12px; margin-bottom: 20px; }
  .barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  button {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--borde);
    padding: 9px 16px; border-radius: 8px; font-weight: 700; font-size: 12px;
    cursor: pointer; text-transform: uppercase; letter-spacing: .5px;
  }
  button:hover { border-color: var(--azul); }
  button.primary { background: var(--azul); border-color: var(--azul); }
  .auto { color: var(--txt2); font-size: 11px; display: flex; align-items: center; gap: 6px; }

  #banner {
    padding: 12px 16px; border-radius: 10px; border: 1px solid var(--borde);
    font-weight: 800; font-size: 13px; margin-bottom: 20px; letter-spacing: .5px;
  }
  #banner.ok  { background: var(--verde-bg); border-color: var(--verde); color: #86efac; }
  #banner.bad { background: var(--rojo-bg);  border-color: var(--rojo);  color: #fca5a5; }
  #banner.warn{ background: var(--ambar-bg); border-color: var(--ambar); color: #fcd34d; }
  #banner.neutral { background: var(--panel); color: var(--txt2); }

  /* ---- Panel de nodos ---- */
  .nodos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .nodo {
    background: var(--panel); border: 2px solid var(--borde);
    border-radius: 14px; padding: 16px;
  }
  .nodo.vivo   { border-color: var(--verde); }
  .nodo.caido  { border-color: var(--rojo); opacity: .75; }
  .nodo h3 { margin: 0; font-size: 14px; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  .semaforo { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
  .semaforo.on  { background: var(--verde); box-shadow: 0 0 10px var(--verde); }
  .semaforo.off { background: var(--rojo); }
  .rol { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--txt2); margin: 6px 0 12px; }
  .dato { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-top: 1px solid var(--borde); }
  .dato b { font-variant-numeric: tabular-nums; }
  .mono { font-family: Consolas, monospace; font-size: 11px; color: var(--txt2); }

  /* ---- Bloques ---- */
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--txt2); margin: 26px 0 12px; }
  .bloque {
    background: var(--panel); border: 2px solid var(--borde);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
  }
  .bloque.bad { border-color: var(--rojo); }
  .cab { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .idx { font-weight: 900; font-size: 15px; }
  .badge { font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .5px; }
  .badge.ok      { background: var(--verde); color: #022c16; }
  .badge.bad     { background: var(--rojo); color: #fff; }
  .badge.heredado{ background: #7c3aed; color: #fff; }
  .badge.firma   { background: var(--panel2); color: var(--txt); border: 1px solid var(--verde); }
  .titulo { color: var(--txt2); font-size: 12px; }
  .firmas { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .firmas .etq { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--txt2); margin-right: 4px; }
  .hash { font-family: Consolas, monospace; font-size: 11px; color: var(--txt2); margin-top: 6px; }
  .nota { color: var(--txt2); font-size: 11px; margin-top: 18px; line-height: 1.6; border-top: 1px solid var(--borde); padding-top: 12px; }
  .resumen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0; }
  .metrica { background: rgba(15,23,42,.9); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; }
  .metrica .numero { display:block; font-size: 25px; color:#f8fafc; font-weight:900; font-variant-numeric: tabular-nums; }
  .metrica .etiqueta { font-size:10px; color:var(--txt2); letter-spacing:.08em; text-transform:uppercase; }
  .topologia { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items:center; gap: 10px; padding: 20px; border: 1px solid var(--borde); border-radius: 16px; background: rgba(15,23,42,.86); margin-bottom: 24px; overflow:auto; }
  .estacion { min-width: 175px; padding: 15px; border: 1px solid #3b82f6; border-radius: 12px; text-align:center; background: #0b1b33; }
  .estacion .simbolo { font-size: 28px; display:block; margin-bottom:5px; }
  .estacion b { font-size: 12px; display:block; }
  .estacion span { color:var(--txt2); font-size:10px; display:block; margin-top:4px; }
  .flecha { color:#60a5fa; min-width:72px; text-align:center; font-size:23px; }
  .flecha small { display:block; font-size:9px; letter-spacing:.08em; color:#93c5fd; text-transform:uppercase; }
  .pasos { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-bottom: 24px; }
  .paso { border-top:3px solid #2563eb; background:var(--panel); padding:13px; border-radius:0 0 10px 10px; }
  .paso .n { color:#60a5fa; font-size:10px; font-weight:900; letter-spacing:.12em; }
  .paso b { display:block; margin:5px 0; font-size:12px; }
  .paso span { color:var(--txt2); font-size:11px; line-height:1.4; }
  @media (max-width: 720px) { body { padding: 12px; } .hero { grid-template-columns: 1fr; padding:18px; } .prueba,.resumen,.pasos { grid-template-columns:1fr 1fr; } .topologia { grid-template-columns:1fr; text-align:center; } .flecha { transform:rotate(90deg); margin:6px auto; } }
</style>
</head>
<body>
<main class="contenedor">
<section class="visual-hero">
  <div class="visual-title">ECEME · Red blockchain privada</div>
  <div class="cadena-visual" aria-label="Acta encadenada, firmada y replicada">
    <div class="punto" title="Acta">▤</div><div class="linea"></div>
    <div class="punto" title="Bloque SHA-256">⬡</div><div class="linea"></div>
    <div class="punto" title="Firmas Ed25519">✦</div><div class="linea"></div>
    <div class="punto" title="Nodos">◉</div>
  </div>
</section>

<h1>Red privada permisionada — cadena de actas</h1>
<div class="sub" id="subtitulo">Cargando…</div>

<div class="barra">
  <button class="primary" onclick="refrescar()">Actualizar estado</button>
  <button onclick="verificacionCruzada()">Verificación cruzada</button>
  <a href="/blockchain.html"><button>Ver la cadena</button></a>
  <label class="auto"><input type="checkbox" id="autoref" checked> Autorefresco cada 3 s</label>
</div>

<div id="banner" class="neutral">Consultando el estado de la red…</div>

<div class="resumen">
  <div class="metrica"><span class="numero" id="m-nodos">—</span><span class="etiqueta">Nodos en línea</span></div>
  <div class="metrica"><span class="numero" id="m-quorum">—</span><span class="etiqueta">Firmas requeridas</span></div>
  <div class="metrica"><span class="numero" id="m-bloques">—</span><span class="etiqueta">Bloques auditados</span></div>
  <div class="metrica"><span class="numero" id="m-integridad">—</span><span class="etiqueta">Integridad de cadena</span></div>
</div>
<h2>Nodos autorizados de la red</h2>
<div class="nodos" id="nodos"></div>

<h2>Bloques y sus firmas</h2>
<div id="bloques"></div>

<script>
const API = '';   // misma máquina que sirve esta página (nodo 1)

const corto = (h, n = 16) => (h ? String(h).slice(0, n) + '…' : '—');

async function pedir(ruta) {
  const r = await fetch(API + ruta);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function pintarBanner(clase, texto) {
  const b = document.getElementById('banner');
  b.className = clase;
  b.textContent = texto;
}

function pintarNodos(estado) {
  document.getElementById('m-nodos').textContent = estado.nodos_vivos + '/' + estado.total_nodos;
  document.getElementById('m-quorum').textContent = estado.quorum + ' de ' + estado.total_nodos;
  document.getElementById('subtitulo').textContent =
    estado.red + ' · firma ' + estado.algoritmo_firma + ' · hash ' + estado.algoritmo_hash +
    ' · quórum ' + estado.quorum + ' de ' + estado.total_nodos;

  document.getElementById('nodos').innerHTML = estado.nodos.map(n => `
    <div class="nodo ${n.vivo ? 'vivo' : 'caido'}">
      <h3><span class="semaforo ${n.vivo ? 'on' : 'off'}"></span> ${n.nombre}</h3>
      <div class="rol">${n.nodeId} · ${n.rol}</div>
      <div class="dato"><span>Estado</span><b>${n.vivo ? 'EN LÍNEA' : 'CAÍDO'}</b></div>
      <div class="dato"><span>Altura de su copia</span><b>${n.vivo ? n.altura : '—'}</b></div>
      <div class="dato"><span>Base de datos</span><b class="mono">${n.base_datos || '—'}</b></div>
      <div class="dato"><span>Último hash</span><b class="mono">${corto(n.ultimo_hash, 12)}</b></div>
    </div>`).join('');

  if (!estado.puede_sellar) {
    pintarBanner('bad',
      '● SIN QUÓRUM · ' + estado.nodos_vivos + '/' + estado.total_nodos + ' NODOS · MÍNIMO ' + estado.quorum);
  } else if (!estado.copias_coinciden) {
    pintarBanner('warn',
      '● COPIAS EN SINCRONIZACIÓN · ' + estado.nodos_vivos + '/' + estado.total_nodos + ' NODOS');
  } else {
    pintarBanner('ok',
      '● RED OPERATIVA · ' + estado.nodos_vivos + '/' + estado.total_nodos + ' NODOS · QUÓRUM ' + estado.quorum + '/' + estado.total_nodos);
  }
}

function pintarBloques(cadena) {
  document.getElementById('m-bloques').textContent = cadena.length;
  document.getElementById('bloques').innerHTML = cadena.map(b => {
    const firmas = b.firmas || [];
    const heredado = firmas.length === 0;
    const mal = !b.valido;
    return `
    <div class="bloque ${mal ? 'bad' : ''}">
      <div class="cab">
        <span class="idx">Bloque #${b.indice}</span>
        <span class="titulo">${(b.acta && b.acta.materia) || ''} ${b.ciclo ? '· ' + b.ciclo : ''}</span>
        ${mal ? '<span class="badge bad">Alterado</span>' : '<span class="badge ok">Íntegro</span>'}
        ${heredado ? '<span class="badge heredado">Heredado · sin firmas</span>' : ''}
      </div>
      ${firmas.length ? `<div class="firmas"><span class="etq">Firmas (${firmas.length}):</span>` +
        firmas.map(f => `<span class="badge firma">✔ ${f.nodeId} · ${f.nombre || ''}</span>`).join('') +
        '</div>' : ''}
      <div class="hash">hash ${corto(b.hash, 24)} · previo ${corto(b.hash_previo, 24)}</div>
    </div>`;
  }).join('');
}

async function refrescar() {
  try {
    const [estado, verif] = await Promise.all([
      pedir('/api/red/estado'),
      pedir('/api/blockchain/verificar')
    ]);
    pintarNodos(estado);
    pintarBloques(verif.bloques);
    document.getElementById('m-integridad').textContent = verif.valida ? 'ÍNTEGRA' : 'ALERTA';
    if (!verif.valida) {
      pintarBanner('bad',
        '● ALERTA · BLOQUE #' + verif.primer_error.indice + ' · ' + verif.primer_error.motivo);
    }
  } catch (e) {
    pintarBanner('bad', 'No se pudo consultar la red: ' + e.message);
  }
}

async function verificacionCruzada() {
  try {
    const v = await pedir('/api/red/verificacion-cruzada');
    if (v.todas_coinciden) {
      pintarBanner('ok',
        'VERIFICACIÓN CRUZADA CONFORME: las copias vivas son idénticas (altura ' +
        v.altura_referencia + ').');
      return;
    }
    const partes = [];
    if (v.alterados_en_referencia.length) {
      partes.push('la copia del nodo 1 tiene alterado(s) el/los bloque(s) ' + v.alterados_en_referencia.join(', '));
    }
    v.comparaciones.filter(c => c.vivo && c.diverge_en !== null && c.diverge_en !== undefined)
      .forEach(c => partes.push(c.nodeId + ' diverge en el bloque ' + c.diverge_en));
    v.comparaciones.filter(c => c.vivo && c.atrasado)
      .forEach(c => partes.push(c.nodeId + ' está atrasado (altura ' + c.altura + ')'));
    v.comparaciones.filter(c => !c.vivo)
      .forEach(c => partes.push(c.nodeId + ' está caído'));
    pintarBanner('bad', 'DIVERGENCIA DETECTADA: ' + partes.join(' · '));
  } catch (e) {
    pintarBanner('bad', 'No se pudo verificar: ' + e.message);
  }
}

refrescar();
setInterval(() => { if (document.getElementById('autoref').checked) refrescar(); }, 3000);
</script>
</main>
</body>
</html>
